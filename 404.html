<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Robbie Andrew: Climate Data & Work</title>
    <script>
      (function() {
        var pathname = window.location.pathname;
        var search = window.location.search;
        var hash = window.location.hash;
        
        // Handle repo subpath for GitHub Pages
        var repo = '/robbieandrew.github.io';
        var route = pathname;
        if (pathname.startsWith(repo)) {
          route = pathname.slice(repo.length);
        }
        if (!route.startsWith('/')) {
          route = '/' + route;
        }
        
        var base = pathname.startsWith(repo) ? repo : '';
        var target = base + '/?p=' + encodeURIComponent(route) + (hash ? hash : '');
        window.location.replace(target);
      })();
    </script>
  </head>
  <body style="font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; display: flex; align-items: center; justify-content: center; min-height: 100vh; margin: 0; background: #ffffff; color: #11181c;">
    <div style="text-align: center;">
      <h2 style="margin-bottom: 8px;">Loading Robbie Andrew's Work...</h2>
      <p style="color: #687076; font-size: 14px;">Redirecting to climate dashboard</p>
    </div>
  </body>
</html>
